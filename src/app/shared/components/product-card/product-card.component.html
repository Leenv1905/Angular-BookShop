<div class="product-card">

  <!-- Card Actions (hover) -->
  <div class="card-actions">
    <button mat-icon-button (click)="addToCart()">
      <mat-icon>shopping_cart</mat-icon>
    </button>
  </div>

  <!-- Discount badge -->
  <div class="discount" *ngIf="product.discount">
    {{ product.discount }}
  </div>

  <!-- Image -->
  <img
    class="product-image"
    [src]="product.image"
    [alt]="product.name"
    (click)="navigateDetail()"
  />

  <div class="content">

    <!-- Name -->
    <h3 class="title" (click)="navigateDetail()">
      {{ product.name }}
    </h3>

    <!-- Author + rating -->
    <div class="meta">
      <span class="author">{{ product.author }}</span>

      <span class="rating">
        <mat-icon
          *ngFor="let _ of stars()"
        >star</mat-icon>
      </span>
    </div>

    <!-- Price -->
    <div class="price">
      <span
        class="original"
        [class.line-through]="product.salePrice"
      >
        {{ product.price | number:'1.0-0' }} $
      </span>

      <span
        class="sale"
        *ngIf="product.salePrice"
      >
        {{ product.salePrice | number:'1.0-0' }} $
      </span>
    </div>

  </div>
</div>
